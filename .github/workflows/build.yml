name: Build and verify CurseTorrent

on:
  push:
    branches: [main, 'fix/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cursetorrent-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'

jobs:
  core:
    name: Core verification (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          dotnet-version: '10.0.x'
      - name: Verify original and audit regression suites
        run: |
          set -euo pipefail
          for project in tests/CurseTorrent.Tests/CurseTorrent.Tests.csproj tests/CurseTorrent.RegressionTests/CurseTorrent.RegressionTests.csproj tests/CurseTorrent.FileSafetyTests/CurseTorrent.FileSafetyTests.csproj tests/CurseTorrent.CompatibilityTests/NetworkAudit.csproj; do
            dotnet restore "$project" --locked-mode --disable-parallel -m:1
            dotnet build "$project" -c Release --no-restore -m:1
            dotnet run --project "$project" -c Release --no-build --no-restore
          done

  windows:
    name: Windows package and native UI
    needs: core
    runs-on: windows-latest
    timeout-minutes: 25
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          dotnet-version: '10.0.x'
      - name: Parse all PowerShell scripts
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($script in Get-ChildItem scripts -Filter '*.ps1') {
            $parseTokens = $null
            $parseErrors = $null
            [void][Management.Automation.Language.Parser]::ParseFile($script.FullName, [ref]$parseTokens, [ref]$parseErrors)
            if ($parseErrors.Count -gt 0) { throw ($parseErrors | Out-String) }
          }
      - name: Windows data safety and engine regressions
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($project in @('tests/CurseTorrent.RegressionTests/CurseTorrent.RegressionTests.csproj', 'tests/CurseTorrent.FileSafetyTests/CurseTorrent.FileSafetyTests.csproj', 'tests/CurseTorrent.CompatibilityTests/NetworkAudit.csproj')) {
            dotnet restore $project --locked-mode --disable-parallel -m:1
            if ($LASTEXITCODE -ne 0) { throw "Restore failed: $project" }
            dotnet build $project -c Release --no-restore -m:1
            if ($LASTEXITCODE -ne 0) { throw "Build failed: $project" }
            dotnet run --project $project -c Release --no-build --no-restore
            if ($LASTEXITCODE -ne 0) { throw "Regression failed: $project" }
          }
      - name: Native WPF behavior and layout regressions
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet restore tests/CurseTorrent.UiTests/CurseTorrent.UiTests.csproj --locked-mode --disable-parallel -m:1
          if ($LASTEXITCODE -ne 0) { throw 'UI restore failed' }
          dotnet build tests/CurseTorrent.UiTests/CurseTorrent.UiTests.csproj -c Release --no-restore -m:1
          if ($LASTEXITCODE -ne 0) { throw 'UI build failed' }
          $output = Join-Path $env:RUNNER_TEMP 'CurseTorrent-ui-regressions'
          New-Item -ItemType Directory -Path $output -Force | Out-Null
          $app = Join-Path $PWD 'tests/CurseTorrent.UiTests/bin/Release/net10.0-windows/CurseTorrent.UiTests.exe'
          $process = Start-Process -FilePath $app -ArgumentList ('"' + $output + '"') -PassThru -RedirectStandardOutput (Join-Path $output 'stdout.txt') -RedirectStandardError (Join-Path $output 'stderr.txt')
          $finished = $process.WaitForExit(120000)
          if (-not $finished) { $process.Kill() }
          $process.WaitForExit()
          Get-Content (Join-Path $output 'stdout.txt') | Write-Host
          Get-Content (Join-Path $output 'stderr.txt') | Write-Host
          foreach ($file in Get-ChildItem $output -Filter '*.png') {
            Write-Host ('FIX_IMAGE_BEGIN ' + $file.Name)
            $encoded = [Convert]::ToBase64String([IO.File]::ReadAllBytes($file.FullName))
            for ($i = 0; $i -lt $encoded.Length; $i += 6000) { Write-Host ('FIX_IMAGE_DATA ' + $encoded.Substring($i, [Math]::Min(6000, $encoded.Length - $i))) }
            Write-Host ('FIX_IMAGE_END ' + $file.Name)
          }
          if (-not $finished) { throw 'UI regressions timed out' }
          if ($process.ExitCode -ne 0) { throw "UI regressions failed: $($process.ExitCode)" }
          New-Item -ItemType Directory -Path artifacts -Force | Out-Null
          Copy-Item (Join-Path $output 'ui-regression-results.json') artifacts/ui-regression-results.json
          Compress-Archive -Path (Join-Path $output '*.png') -DestinationPath artifacts/CurseTorrent-ui-verification.zip -Force
      - name: Run Windows core checks and create the portable package
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path artifacts -Force | Out-Null
          ./scripts/build.ps1 -OutputDirectory (Join-Path $PWD 'artifacts') 2>&1 | Tee-Object -FilePath artifacts/build-verification.txt
      - name: Verify the packaged native UI and retain an actual screenshot
        run: |
          $ErrorActionPreference = 'Stop'
          $smokeRoot = Join-Path $env:RUNNER_TEMP ('CurseTorrent-smoke-' + [Guid]::NewGuid().ToString('N'))
          Expand-Archive -LiteralPath artifacts/CurseTorrent-win-x64.zip -DestinationPath $smokeRoot
          $packageRoot = Join-Path $smokeRoot 'CurseTorrent'
          $exe = Join-Path $packageRoot 'CurseTorrent.exe'
          $screenshot = Join-Path $PWD 'artifacts/CurseTorrent-preview.png'
          $process = Start-Process -FilePath $exe -ArgumentList @('--smoke-test', '--smoke-test-screenshot', ('"' + $screenshot + '"')) -WorkingDirectory $env:RUNNER_TEMP -PassThru
          if (-not $process.WaitForExit(45000)) {
            $process.Kill()
            throw 'The native UI smoke check timed out.'
          }
          $process.WaitForExit()
          if ($process.ExitCode -ne 0) {
            $appLog = Join-Path $env:LOCALAPPDATA 'CurseTorrent/app.log'
            if (Test-Path -LiteralPath $appLog) { Get-Content -LiteralPath $appLog -Raw | Write-Host }
            throw "Native UI smoke check failed: $($process.ExitCode)."
          }
          if (-not (Test-Path -LiteralPath $screenshot -PathType Leaf)) { throw 'The native UI screenshot was not created.' }
          & powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File ./scripts/test-install.ps1 -PackageDirectory $packageRoot
          if ($LASTEXITCODE -ne 0) { throw 'Windows PowerShell installation/retention check failed.' }
          "Native UI exit: 0`nInstaller/uninstaller retention: PASS`nCommit: $env:GITHUB_SHA`nRun: https://github.com/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID`nSDK: $(dotnet --version)" | Set-Content artifacts/windows-verification.txt -Encoding utf8
      - name: Publish a verified preview release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          [xml]$props = Get-Content Directory.Build.props
          $version = [string]$props.Project.PropertyGroup.Version
          $tag = "v$version-preview.$env:GITHUB_RUN_NUMBER.$env:GITHUB_RUN_ATTEMPT"
          $notes = @"
          CurseTorrent for Windows 11 x64 — development preview.

          Download **CurseTorrent-win-x64.zip**, extract the complete folder, and run **CurseTorrent.exe**. .NET is included. Optional per-user installation: **install.cmd**.

          This build passed Linux and Windows core, data safety and lifecycle regressions; v1/v2/hybrid torrent and magnet transfers; native WPF behavior/layout checks; and installer rollback/retention checks. Audit fixes include read-only verification, protected existing files, fresh content verification on restore, bounded metadata cleanup, and corrected UI controls. See the attached verification logs and actual UI screenshot. The UI smoke check does not replace a prolonged manual test on a real desktop/network.

          Commit: $env:GITHUB_SHA
          Build: https://github.com/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID
          SHA-256 is in SHA256SUMS.txt. This preview executable is not code-signed.
          "@
          $notes | Set-Content artifacts/release-notes.md -Encoding utf8
          & gh release create $tag --target $env:GITHUB_SHA --title "CurseTorrent $version — preview $env:GITHUB_RUN_NUMBER.$env:GITHUB_RUN_ATTEMPT" --notes-file artifacts/release-notes.md --draft --prerelease
          if ($LASTEXITCODE -ne 0) { throw 'Could not create the draft release.' }
          & gh release upload $tag artifacts/CurseTorrent-win-x64.zip artifacts/SHA256SUMS.txt artifacts/CurseTorrent-preview.png artifacts/build-verification.txt artifacts/windows-verification.txt artifacts/ui-regression-results.json artifacts/CurseTorrent-ui-verification.zip
          if ($LASTEXITCODE -ne 0) { throw 'Could not upload the verified release files. The release remains a draft.' }
          & gh release edit $tag --draft=false --latest=false
          if ($LASTEXITCODE -ne 0) { throw 'Could not publish the preview release.' }
          "### Windows download`nhttps://github.com/$env:GITHUB_REPOSITORY/releases/tag/$tag" | Add-Content $env:GITHUB_STEP_SUMMARY
